name: KMP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kmp-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.caching=true -Dorg.gradle.daemon=false

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      shared: ${{ steps.paths.outputs.shared }}
      android: ${{ steps.paths.outputs.android }}
      ios: ${{ steps.paths.outputs.ios }}
      signing: ${{ steps.signing.outputs.enabled }}
    steps:
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        id: paths
        with:
          filters: |
            shared:
              - '**/src/commonMain/**'
              - '**/src/commonTest/**'
              - 'gradle/**'
              - '**/*.gradle.kts'
              - '**/libs.versions.toml'
              - 'gradle.properties'
              - 'gradlew*'
              - '.github/workflows/ci-kmp.yml'
              - '.github/scripts/ci-firebase.py'
            android:
              - 'app/**'
              - '**/src/android*/**'
            ios:
              - '**/src/ios*/**'
              - '**/src/apple*/**'
              - '**/src/native*/**'
              - 'iosApp/**'
              - '.github/scripts/ios-release.sh'
              - 'docs/IOS_RELEASE_SETUP.md'
      # Secrets cannot be used directly in a job-level `if` expression.
      - name: Detect configured signing (trusted events only)
        id: signing
        if: github.event_name != 'pull_request'
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERT_BASE64 }}
          PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          enabled=false
          if [[ -n "$CERTIFICATE" && -n "$PASSWORD" && -n "$PROFILE" ]]; then
            enabled=true
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

  android:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Use isolated CI Firebase configuration
        run: python3 .github/scripts/ci-firebase.py
      - name: Shared compilation, unit tests and debug APK
        run: ./gradlew --build-cache --parallel --max-workers=2 :composeApp:compileCommonMainKotlinMetadata :composeApp:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/
            composeApp/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Identify native toolchains
        id: toolchain
        run: echo "xcode=$(xcodebuild -version | shasum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.konan
            ~/.konan-dependencies
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle.properties', '**/*.gradle.kts') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache@v4
        with:
          path: |
            .ci/SourcePackages
            .ci/DerivedData
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Caches/CocoaPods
          key: xcode-sim-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('iosApp/**', 'gradle/libs.versions.toml') }}-${{ github.sha }}
          restore-keys: |
            xcode-sim-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('iosApp/**', 'gradle/libs.versions.toml') }}-
            xcode-sim-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode }}-
      - name: Run shared tests on the available simulator architecture
        run: |
          if [[ "$(uname -m)" == arm64 ]]; then target=iosSimulatorArm64Test; else target=iosX64Test; fi
          ./gradlew --build-cache --parallel --max-workers=2 ":composeApp:$target"
      - name: Build unsigned simulator app
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$PWD/.ci/DerivedData" \
            -clonedSourcePackagesDirPath "$PWD/.ci/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --sequesterRsrc --keepParent \
            .ci/DerivedData/Build/Products/Debug-iphonesimulator/iosApp.app iosApp-simulator.zip
      - name: Upload iOS test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-reports
          path: composeApp/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: iosApp-simulator.zip
          if-no-files-found: error
          retention-days: 7

  ios-release:
    needs: [changes, android, ios]
    if: github.event_name != 'pull_request' && needs.changes.outputs.signing == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle.properties', '**/*.gradle.kts') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache@v4
        with:
          path: .ci/SourcePackages
          key: swift-release-${{ runner.arch }}-${{ hashFiles('iosApp/**/Package.resolved', 'iosApp/**/*.pbxproj') }}
      - name: Archive and export signed IPA
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: bash .github/scripts/ios-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: .ci/export/*.ipa
          if-no-files-found: error
          retention-days: 7
